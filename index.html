<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Nexus Chat User Panel is a real-time messaging interface where you can connect with friends and join global chat spaces."> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>(live chat)Online chat & make a friend |nexus chat</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; display: flex; flex-direction: column; }
        
        #waitingScreen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 5000; color: white; transition: opacity 0.4s ease;
        }
        .waiting-logo { font-size: 34px; font-weight: 900; letter-spacing: 2px; margin-bottom: 20px; text-transform: uppercase; text-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .spinner {
            width: 50px; height: 50px; border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #ffffff; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .waiting-text { font-size: 14px; opacity: 0.9; letter-spacing: 1px; }

        #landingPageView { 
            width: 100vw; height: 100vh; height: 100dvh; 
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%); 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            padding: 20px; text-align: center; color: white; position: fixed; top: 0; left: 0; z-index: 3000; 
            overflow-y: auto;
        }
        .landing-container { max-width: 460px; width: 100%; display: flex; flex-direction: column; align-items: center; margin: auto; padding: 15px 0; }
        .nexus-brand-tag { font-size: 12px; text-transform: uppercase; letter-spacing: 3px; background: rgba(255, 255, 255, 0.15); padding: 6px 18px; border-radius: 20px; margin-bottom: 12px; font-weight: bold; border: 1px solid rgba(255, 255, 255, 0.3); backdrop-filter: blur(10px); }
        .landing-title { font-size: 32px; margin: 0 0 8px 0; font-weight: 900; text-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .landing-desc { font-size: 14px; margin: 0 0 16px 0; opacity: 0.9; line-height: 1.5; }
        .landing-card { width: 100%; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.2); padding: 26px 22px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); text-align: left; color: #1e293b; }
        
        .landing-input, .landing-select { width: 100%; padding: 12px 14px; margin-bottom: 12px; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 14px; background: #f8fafc; color: #1e293b; outline: none; transition: all 0.3s; }
        .landing-input:focus, .landing-select:focus { border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99,102,241,0.15); background: #ffffff; }
        
        .landing-avatar-grid { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 15px; }
        .landing-avatar-item { width: 48px; height: 48px; border-radius: 50%; cursor: pointer; border: 2px solid #cbd5e1; object-fit: cover; background: #f1f5f9; transition: all 0.2s; }
        .landing-avatar-item.selected { border-color: #6366f1; transform: scale(1.1); box-shadow: 0 4px 12px rgba(99,102,241,0.3); }

        .landing-submit-btn { width: 100%; padding: 13px; background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(79,70,229,0.4); transition: opacity 0.2s; }
        .landing-submit-btn:hover { opacity: 0.9; }
        .landing-switch-text { text-align: center; margin-top: 15px; font-size: 13px; color: #64748b; cursor: pointer; font-weight: 500; }
        .landing-switch-text span { color: #4f46e5; text-decoration: underline; font-weight: bold; }

        .brand-header { flex-shrink: 0; background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); color: white; padding: 22px 20px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 6px 20px rgba(0,0,0,0.25); z-index: 100; }
        .brand-top-row { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .brand-header h1 { margin: 0; font-size: 24px; font-weight: 900; letter-spacing: 0.5px; }
        .user-display-badge { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: bold; background: rgba(255, 255, 255, 0.2); padding: 8px 16px; border-radius: 24px; cursor: pointer; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        .user-display-badge svg { width: 18px; height: 18px; fill: currentColor; }

        .search-filter-wrapper { width: 100%; max-width: 520px; display: flex; align-items: center; gap: 8px; position: relative; }
        .search-input { width: 100%; padding: 12px 18px; border-radius: 24px; border: none; font-size: 14px; outline: none; background: rgba(255, 255, 255, 0.95); box-shadow: 0 4px 15px rgba(0,0,0,0.1); color: #1e293b; }
        .gender-filter-btn { background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255,255,255,0.3); width: 44px; height: 44px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; color: white; position: relative; backdrop-filter: blur(10px); }
        .gender-filter-btn svg { width: 20px; height: 20px; fill: currentColor; }
        .gender-dropdown-menu { position: absolute; top: 52px; right: 0; background: white; color: #1e293b; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 160px; display: none; z-index: 1000; overflow: hidden; border: 1px solid #e2e8f0; }
        .gender-dropdown-menu.show { display: block; }
        .gender-dropdown-item { padding: 12px 16px; font-size: 14px; cursor: pointer; border-bottom: 1px solid #f1f5f9; font-weight: 500; }
        .gender-dropdown-item:hover { background: #f8fafc; color: #4f46e5; }

        .main-container { flex: 1; width: 100%; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden; padding: 12px 15px 70px 15px; background: #0f172a; }
        .section-view { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
        .scrollable-list { flex: 1; overflow-y: auto; border: 1px solid #334155; border-radius: 16px; background: #1e293b; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #1e293b; border-top: 1px solid #334155; display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; box-shadow: 0 -5px 20px rgba(0,0,0,0.3); }
        .nav-item { background: none; border: none; color: #94a3b8; font-size: 11px; font-weight: bold; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; transition: color 0.2s; }
        .nav-item.active { color: #818cf8; }
        .nav-icon { width: 22px; height: 22px; fill: currentColor; }
        .nav-notification-dot { position: absolute; top: 0; right: 28%; width: 8px; height: 8px; background-color: #f43f5e; border-radius: 50%; display: none; }
        .nav-notification-dot.show { display: block; }

        .fullscreen-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px); z-index: 2000; display: flex; justify-content: center; align-items: center; padding: 15px; }
        .fullscreen-form-box { background: #1e293b; border: 1px solid #334155; color: white; padding: 24px; border-radius: 20px; width: 100%; max-width: 380px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .hidden { display: none !important; }
        input.auth-input, select.auth-input, button.form-submit { display: block; width: 100%; margin-bottom: 12px; padding: 12px 14px; border: 1px solid #475569; border-radius: 10px; font-size: 14px; background: #0f172a; color: white; outline: none; }
        button.form-submit { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); color: white; border: none; cursor: pointer; font-weight: bold; box-shadow: 0 4px 12px rgba(79,70,229,0.3); }
        
        .avatar-options-grid { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
        .avatar-option-item { width: 48px; height: 48px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; object-fit: cover; background: #0f172a; }
        .avatar-option-item.selected { border-color: #6366f1; }

        .list-card-item { padding: 14px 16px; background: #1e293b; border-bottom: 1px solid #334155; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: background 0.2s; }
        .list-card-item:hover { background: #334155; }
        .item-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; margin-right: 14px; flex-shrink: 0; background: #334155; border: 2px solid rgba(255,255,255,0.1); }
        .item-info { flex-grow: 1; overflow: hidden; }
        .item-title-wrapper { display: flex; align-items: baseline; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
        .item-title { font-weight: bold; color: #f8fafc; font-size: 15px; margin: 0; }
        .item-meta-tag { font-size: 11px; color: #cbd5e1; background: #334155; padding: 2px 8px; border-radius: 6px; font-weight: 500; }
        .item-sub { font-size: 13px; color: #94a3b8; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .delete-chat-btn { background: #f43f5e; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; display: none; }
        .list-card-item.show-delete .delete-chat-btn { display: block; }

        #chatRoomView { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh; background: #0f172a; z-index: 1500; display: flex; flex-direction: column; overflow: hidden; }
        .chat-header-bar { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); color: white; padding: 18px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .back-to-list-btn { background: rgba(255,255,255,0.2); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; backdrop-filter: blur(10px); }
        .chat-header-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.8); }
        
        .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #0f172a; }
        .chat-msg { max-width: 75%; padding: 12px 16px; border-radius: 16px; font-size: 14px; word-break: break-word; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .chat-msg.sent { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .chat-msg.received { background: #1e293b; color: #f8fafc; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #334155; }
        .chat-msg-delete-btn { background: rgba(0,0,0,0.3); color: white; border: none; border-radius: 4px; font-size: 10px; padding: 3px 8px; cursor: pointer; align-self: flex-end; }
        
        .chat-input-area { display: flex; padding: 12px 16px; background: #1e293b; border-top: 1px solid #334155; gap: 10px; flex-shrink: 0; align-items: center; }
        .media-upload-btn { background: none; border: none; cursor: pointer; color: #818cf8; display: flex; align-items: center; justify-content: center; padding: 4px; }
        .media-upload-btn svg { width: 24px; height: 24px; fill: currentColor; }
        
        .chat-media-img { max-width: 200px; max-height: 200px; border-radius: 8px; object-fit: cover; margin-top: 4px; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); }
        .chat-media-video { max-width: 220px; max-height: 180px; border-radius: 8px; margin-top: 4px; background: #000; cursor: pointer; }

        #mediaFullscreenModal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
            background: rgba(0, 0, 0, 0.95); z-index: 6000; display: flex; justify-content: center; align-items: center;
        }
        #mediaFullscreenModal.hidden { display: none !important; }
        .fullscreen-media-content { max-width: 95vw; max-height: 90vh; object-fit: contain; border-radius: 4px; }
        .fullscreen-close-btn {
            position: absolute; top: 20px; right: 20px; background: rgba(255, 255, 255, 0.2); color: white;
            border: none; width: 44px; height: 44px; border-radius: 50%; font-size: 20px; font-weight: bold; cursor: pointer;
            display: flex; justify-content: center; align-items: center; backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>

    <div id="waitingScreen">
        <div class="waiting-logo">Nexus Chat</div>
        <div class="spinner"></div>
        <div class="waiting-text">Loading application data...</div>
    </div>

    <div id="mediaFullscreenModal" class="hidden">
        <button type="button" class="fullscreen-close-btn" id="closeMediaModalBtn">×</button>
        <div id="fullscreenMediaContainer" style="display:flex; justify-content:center; align-items:center; width:100%; height:100%;"></div>
    </div>

    <div id="landingPageView" class="hidden">
        <div class="landing-container">
            <div class="nexus-brand-tag">Welcome to Nexus Chat</div>
            <h1 class="landing-title" id="landingMainHeading">Create Account</h1>
            <p class="landing-desc" id="landingMainDesc">Connect with friends instantly, chat in real-time, and join global community spaces effortlessly.</p>
            
            <div class="landing-card">
                <form id="landingAuthForm">
                    <input type="text" id="landingUsername" class="landing-input" placeholder="Username" required>
                    <input type="email" id="landingEmail" class="landing-input" placeholder="Email Address (e.g., user@gmail.com)" required>
                    <input type="password" id="landingPassword" class="landing-input" placeholder="Password (min 6 characters)" required>
                    
                    <div id="landingRegisterExtraFields">
                        <select id="landingGender" class="landing-select" required>
                            <option value="" disabled selected>Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                        <select id="landingCountry" class="landing-select" required>
                            <option value="" disabled selected>Select Country</option>
                            <option value="Sri Lanka">Sri Lanka</option>
                            <option value="India">India</option>
                            <option value="United States">United States</option>
                            <option value="United Kingdom">United Kingdom</option>
                            <option value="Australia">Australia</option>
                            <option value="Canada">Canada</option>
                            <option value="Other">Other</option>
                        </select>
                        <label style="font-size: 12px; font-weight: bold; margin-bottom: 6px; display: block; color: #475569;">Choose Avatar:</label>
                        <div class="landing-avatar-grid" id="landingAvatarOptionsGrid">
                            <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Felix" class="landing-avatar-item selected" data-url="https://api.dicebear.com/7.x/bottts/svg?seed=Felix" alt="Av1">
                            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Aneka" class="landing-avatar-item" data-url="https://api.dicebear.com/7.x/avataaars/svg?seed=Aneka" alt="Av2">
                            <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Bandit" class="landing-avatar-item" data-url="https://api.dicebear.com/7.x/adventurer/svg?seed=Bandit" alt="Av3">
                            <img src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=Smile" class="landing-avatar-item" data-url="https://api.dicebear.com/7.x/fun-emoji/svg?seed=Smile" alt="Av4">
                        </div>
                    </div>
                    <button type="submit" id="landingSubmitBtn" class="landing-submit-btn">Register Now</button>
                </form>
                <div class="landing-switch-text" id="landingSwitchText">Already have an account? <span>Login</span></div>
            </div>
        </div>
    </div>

    <div class="brand-header">
        <div class="brand-top-row">
            <div id="loggedInUserDisplay" class="user-display-badge">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
                <span id="headerUsernameText">Guest</span>
            </div>
            <h1>Nexus Chat</h1>
            <div style="width: 50px;"></div>
        </div>
        <div class="search-filter-wrapper" id="searchBarContainer">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search contacts...">
            <button type="button" id="genderFilterToggleBtn" class="gender-filter-btn" title="Filter by Gender">
                <svg viewBox="0 0 24 24"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg>
                <div id="genderDropdownMenu" class="gender-dropdown-menu">
                    <div class="gender-dropdown-item" data-gender="All">All Genders</div>
                    <div class="gender-dropdown-item" data-gender="Male">Male</div>
                    <div class="gender-dropdown-item" data-gender="Female">Female</div>
                    <div class="gender-dropdown-item" data-gender="Other">Other</div>
                </div>
            </button>
        </div>
    </div>  

    <div class="main-container">
        <div id="contactsSection" class="section-view">
            <div id="contactsListContainer" class="scrollable-list">
                <p style="text-align: center; color: #94a3b8; padding: 20px;">Loading contacts...</p>
            </div>
        </div>
        <div id="inboxSection" class="section-view hidden">
            <div id="inboxListContainer" class="scrollable-list">
                <p style="text-align: center; color: #94a3b8; padding: 20px;">No messages in inbox.</p>
            </div>
        </div>
    </div>

    <div id="chatRoomView" class="hidden">
        <div class="chat-header-bar">
            <button type="button" class="back-to-list-btn" id="backToListBtn">← Back</button>
            <img id="chatHeaderAvatar" class="chat-header-avatar" src="" alt="DP">
            <div style="display:flex; flex-direction:column; overflow:hidden;">
                <span id="chatRoomTitle" style="font-size: 15px; font-weight: bold; white-space: nowrap;">Chat</span>
                <span id="chatReceiverLastSeen" style="font-size: 11px; color: #cbd5e1;">online</span>
            </div>
        </div>
        <div id="chatMessagesBox" class="chat-messages"></div>
        <div class="chat-input-area">
            <label class="media-upload-btn" title="Send Image or Video">
                <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                <input type="file" id="chatMediaInput" style="display: none;">
            </label>
            <input type="text" id="chatMessageInput" placeholder="Type a message..." style="margin-bottom:0; flex:1; padding: 12px 14px; border:1px solid #334155; border-radius:10px; outline:none; font-size:14px; background:#0f172a; color:white;">
            <button type="button" id="sendChatBtn" class="form-submit" style="width:auto; margin-bottom:0; padding: 12px 18px; border-radius:10px;">Send</button>
        </div>
    </div>

    <div class="bottom-nav" id="bottomNav">
        <button class="nav-item active" id="navContactsBtn">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            Contacts
        </button>
        <button class="nav-item" id="navInboxBtn">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
            Inbox
            <span class="nav-notification-dot" id="inboxNotificationDot"></span>
        </button>
    </div>

    <div id="profileEditOverlay" class="fullscreen-overlay hidden">
        <div class="fullscreen-form-box">
            <h2 style="margin-top:0; color:#818cf8; text-align:center; font-size: 20px;">Edit Profile</h2>
            <form id="profileEditForm">
                <div style="text-align: center; margin-bottom: 12px;">
                    <img id="editCurrentAvatarPreview" src="" style="width: 65px; height: 65px; border-radius: 50%; object-fit: cover; border: 2px solid #6366f1;" alt="DP">
                </div>
                <input type="text" id="editUsernameInput" class="auth-input" disabled style="background:#0f172a; color:#94a3b8;">
                <select id="editGender" class="auth-input" required>
                    <option value="" disabled>Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
                <select id="editCountry" class="auth-input" required>
                    <option value="" disabled>Select Country</option>
                    <option value="Sri Lanka">Sri Lanka</option>
                    <option value="India">India</option>
                    <option value="United States">United States</option>
                    <option value="United Kingdom">United Kingdom</option>
                    <option value="Australia">Australia</option>
                    <option value="Canada">Canada</option>
                    <option value="Other">Other</option>
                </select>
                <label style="font-size: 13px; font-weight: bold; color: #cbd5e1; margin-bottom: 6px; display: block;">Change Avatar:</label>
                <div class="avatar-options-grid" id="editAvatarOptionsGrid">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Felix" class="edit-avatar-option-item avatar-option-item selected" data-url="https://api.dicebear.com/7.x/bottts/svg?seed=Felix" alt="Av1">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Aneka" class="edit-avatar-option-item avatar-option-item" data-url="https://api.dicebear.com/7.x/avataaars/svg?seed=Aneka" alt="Av2">
                    <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Bandit" class="edit-avatar-option-item avatar-option-item" data-url="https://api.dicebear.com/7.x/adventurer/svg?seed=Bandit" alt="Av3">
                    <img src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=Smile" class="edit-avatar-option-item avatar-option-item" data-url="https://api.dicebear.com/7.x/fun-emoji/svg?seed=Smile" alt="Av4">
                </div>
                <button type="submit" class="form-submit">Save Changes</button>
            </form>
            <button type="button" id="profileLogoutBtn" class="form-submit" style="background: #f43f5e; margin-bottom: 8px;">Logout</button>
            <button type="button" id="closeProfileModalBtn" class="form-submit" style="background: #334155; margin-bottom: 0;">Cancel</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, doc, deleteDoc, serverTimestamp, query, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA0huAGXtGHRsRHtVivcLnG-yS3CD6t8Jo",
            authDomain: "blossom-classifieds.firebaseapp.com",
            projectId: "blossom-classifieds",
            storageBucket: "blossom-classifieds.firebasestorage.app",
            messagingSenderId: "774487261814",
            appId: "1:774487261814:web:f1f9abb145d63b86edd557",
            measurementId: "G-VBVWGK1LQT"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        setPersistence(auth, browserLocalPersistence).catch((error) => {
            console.error("Persistence error:", error);
        });

        let currentUsername = null, currentUserDocId = null, currentUserData = null;
        let isLandingRegistering = true, activeChatReceiver = null, isGroupChatActive = false, currentTab = 'contacts';
        let searchQuery = '', selectedGenderFilter = 'All';
        let selectedAvatarUrl = "https://api.dicebear.com/7.x/bottts/svg?seed=Felix";
        let editSelectedAvatarUrl = "https://api.dicebear.com/7.x/bottts/svg?seed=Felix";

        let unsubscribeChat = null, unsubscribeGlobal = null;
        let globalUsersSnap = null, globalChatsSnap = null, globalGroupChatsSnap = null;

        const waitingScreen = document.getElementById('waitingScreen');
        const landingPageView = document.getElementById('landingPageView');
        const profileEditOverlay = document.getElementById('profileEditOverlay');
        const loggedInUserDisplay = document.getElementById('loggedInUserDisplay');
        const headerUsernameText = document.getElementById('headerUsernameText');
        const contactsSection = document.getElementById('contactsSection');
        const inboxSection = document.getElementById('inboxSection');
        const chatRoomView = document.getElementById('chatRoomView');
        const contactsListContainer = document.getElementById('contactsListContainer');
        const inboxListContainer = document.getElementById('inboxListContainer');
        const searchInput = document.getElementById('searchInput');
        const searchBarContainer = document.getElementById('searchBarContainer');
        const bottomNav = document.getElementById('bottomNav');
        
        const mediaFullscreenModal = document.getElementById('mediaFullscreenModal');
        const fullscreenMediaContainer = document.getElementById('fullscreenMediaContainer');

        document.getElementById('closeMediaModalBtn').addEventListener('click', () => {
            mediaFullscreenModal.classList.add('hidden');
            fullscreenMediaContainer.innerHTML = "";
        });

        window.openFullscreenMedia = function(url, type) {
            fullscreenMediaContainer.innerHTML = "";
            if (type === 'video') {
                fullscreenMediaContainer.innerHTML = `<video src="${url}" controls autoplay class="fullscreen-media-content"></video>`;
            } else {
                fullscreenMediaContainer.innerHTML = `<img src="${url}" class="fullscreen-media-content" alt="Fullscreen Image">`;
            }
            mediaFullscreenModal.classList.remove('hidden');
        }

        const landingRegisterExtraFields = document.getElementById('landingRegisterExtraFields');
        const landingMainHeading = document.getElementById('landingMainHeading');
        const landingMainDesc = document.getElementById('landingMainDesc');
        const landingSubmitBtn = document.getElementById('landingSubmitBtn');
        const landingSwitchText = document.getElementById('landingSwitchText');

        landingSwitchText.addEventListener('click', () => {
            isLandingRegistering = !isLandingRegistering;
            if (isLandingRegistering) {
                landingMainHeading.textContent = "Create Account";
                landingMainDesc.textContent = "Connect with friends instantly, chat in real-time, and join global community spaces effortlessly.";
                landingSubmitBtn.textContent = "Register Now";
                landingRegisterExtraFields.classList.remove('hidden');
                landingSwitchText.innerHTML = "Already have an account? <span>Login</span>";
            } else {
                landingMainHeading.textContent = "Welcome Back";
                landingMainDesc.textContent = "Log in to your account and continue your conversations seamlessly.";
                landingSubmitBtn.textContent = "Login Now";
                landingRegisterExtraFields.classList.add('hidden');
                landingSwitchText.innerHTML = "Don't have an account? <span>Register</span>";
            }
        });

        document.querySelectorAll('#landingAvatarOptionsGrid .landing-avatar-item').forEach(img => {
            img.addEventListener('click', (e) => {
                document.querySelectorAll('#landingAvatarOptionsGrid .landing-avatar-item').forEach(i => i.classList.remove('selected'));
                e.target.classList.add('selected');
                selectedAvatarUrl = e.target.getAttribute('data-url');
            });
        });

        document.querySelectorAll('#editAvatarOptionsGrid .edit-avatar-option-item').forEach(img => {
            img.addEventListener('click', (e) => {
                document.querySelectorAll('#editAvatarOptionsGrid .edit-avatar-option-item').forEach(i => i.classList.remove('selected'));
                e.target.classList.add('selected');
                editSelectedAvatarUrl = e.target.getAttribute('data-url');
            });
        });

        const genderFilterToggleBtn = document.getElementById('genderFilterToggleBtn');
        const genderDropdownMenu = document.getElementById('genderDropdownMenu');

        genderFilterToggleBtn.addEventListener('click', (e) => { e.stopPropagation(); genderDropdownMenu.classList.toggle('show'); });
        window.addEventListener('click', () => genderDropdownMenu.classList.remove('show'));

        document.querySelectorAll('.gender-dropdown-item').forEach(item => {
            item.addEventListener('click', (e) => {
                selectedGenderFilter = e.target.getAttribute('data-gender');
                genderDropdownMenu.classList.remove('show');
                renderCurrentView();
            });
        });

        async function updateLastSeenStatus() {
            if (!currentUserDocId) return;
            try {
                await updateDoc(doc(db, "users", currentUserDocId), { lastSeen: serverTimestamp() });
            } catch (err) {
                console.error("LastSeen update error:", err);
            }
        }
        setInterval(updateLastSeenStatus, 30000);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const usersSnap = await getDocs(collection(db, "users"));
                    let found = false;
                    usersSnap.forEach(d => {
                        let data = d.data();
                        if (data.email === user.email || data.uid === user.uid) {
                            found = true;
                            currentUserDocId = d.id;
                            currentUsername = data.username;
                            currentUserData = data;
                        }
                    });

                    waitingScreen.style.opacity = '0';
                    setTimeout(() => waitingScreen.classList.add('hidden'), 400);

                    if (found) {
                        landingPageView.classList.add('hidden');
                        headerUsernameText.textContent = currentUsername;
                        searchBarContainer.classList.remove('hidden');
                        bottomNav.classList.remove('hidden');
                        updateLastSeenStatus();
                        startGlobalDataListener();
                    }
                } catch (err) {
                    console.error("Auth state error:", err);
                }
            } else {
                waitingScreen.style.opacity = '0';
                setTimeout(() => waitingScreen.classList.add('hidden'), 400);
                showLandingPage();
            }
        });

        function showLandingPage() {
            landingPageView.classList.remove('hidden');
            headerUsernameText.textContent = "Guest";
            searchBarContainer.classList.add('hidden');
            bottomNav.classList.add('hidden');
        }

        document.getElementById('landingAuthForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usernameInput = document.getElementById('landingUsername').value.trim().toLowerCase();
            const emailInput = document.getElementById('landingEmail').value.trim();
            const passwordInput = document.getElementById('landingPassword').value;

            try {
                if (isLandingRegistering) {
                    const genderInput = document.getElementById('landingGender').value;
                    const countryInput = document.getElementById('landingCountry').value;

                    const usersSnap = await getDocs(collection(db, "users"));
                    let usernameTaken = false;
                    usersSnap.forEach(d => {
                        if (d.data().username === usernameInput) usernameTaken = true;
                    });

                    if (usernameTaken) {
                        alert("Username already taken! Please choose another.");
                        return;
                    }

                    const userCredential = await createUserWithEmailAndPassword(auth, emailInput, passwordInput);
                    
                    const docRef = await addDoc(collection(db, "users"), {
                        uid: userCredential.user.uid,
                        username: usernameInput,
                        email: emailInput,
                        gender: genderInput,
                        country: countryInput,
                        avatarUrl: selectedAvatarUrl,
                        password: passwordInput,
                        createdAt: serverTimestamp(),
                        lastSeen: serverTimestamp()
                    });

                    currentUserDocId = docRef.id;
                    currentUsername = usernameInput;
                    currentUserData = {
                        uid: userCredential.user.uid,
                        username: usernameInput,
                        email: emailInput,
                        gender: genderInput,
                        country: countryInput,
                        avatarUrl: selectedAvatarUrl
                    };

                    alert("Account created successfully!");
                    landingPageView.classList.add('hidden');
                    headerUsernameText.textContent = currentUsername;
                    searchBarContainer.classList.remove('hidden');
                    bottomNav.classList.remove('hidden');
                    updateLastSeenStatus();
                    startGlobalDataListener();
                } else {
                    await signInWithEmailAndPassword(auth, emailInput, passwordInput);
                }
            } catch (error) {
                alert("Authentication Error: " + error.message);
            }
        });

        loggedInUserDisplay.addEventListener('click', () => {
            if (!currentUsername) return;
            document.getElementById('editUsernameInput').value = currentUsername;
            document.getElementById('editGender').value = currentUserData.gender || "";
            document.getElementById('editCountry').value = currentUserData.country || "";
            editSelectedAvatarUrl = currentUserData.avatarUrl || "https://api.dicebear.com/7.x/bottts/svg?seed=Felix";
            document.getElementById('editCurrentAvatarPreview').src = editSelectedAvatarUrl;

            profileEditOverlay.classList.remove('hidden');
        });

        document.getElementById('closeProfileModalBtn').addEventListener('click', () => profileEditOverlay.classList.add('hidden'));
        document.getElementById('profileLogoutBtn').addEventListener('click', async () => {
            await signOut(auth);
            location.reload();
        });

        document.getElementById('profileEditForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUserDocId) return;
            const newGender = document.getElementById('editGender').value;
            const newCountry = document.getElementById('editCountry').value;

            let updatePayload = { avatarUrl: editSelectedAvatarUrl, gender: newGender, country: newCountry };
            await updateDoc(doc(db, "users", currentUserDocId), updatePayload);
            alert("Profile updated successfully!");
            profileEditOverlay.classList.add('hidden');
            location.reload();
        });

        function startGlobalDataListener() {
            if(unsubscribeGlobal) unsubscribeGlobal();
            unsubscribeGlobal = onSnapshot(collection(db, "users"), (uSnap) => {
                globalUsersSnap = uSnap;
                onSnapshot(collection(db, "chats"), (cSnap) => {
                    globalChatsSnap = cSnap;
                    onSnapshot(collection(db, "groupChats"), (gSnap) => {
                        globalGroupChatsSnap = gSnap;
                        renderCurrentView();
                    });
                });
            });
        }

        function formatLastSeen(timestamp) {
            if (!timestamp) return "offline";
            let date = timestamp.toDate();
            let diffSeconds = Math.floor((new Date() - date) / 1000);
            if (diffSeconds < 60) return "online";
            if (diffSeconds < 3600) return `${Math.floor(diffSeconds / 60)}m ago`;
            if (diffSeconds < 86400) return `Today at ${date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
            return date.toLocaleDateString();
        }

        function renderCurrentView() {
            if (!globalUsersSnap || !globalChatsSnap || !globalGroupChatsSnap) return;
            if (currentTab === 'contacts') renderContactsList(globalUsersSnap, globalChatsSnap, globalGroupChatsSnap);
            else renderInboxList(globalUsersSnap, globalChatsSnap);
        }

        function renderContactsList(usersSnap, chatsSnap, groupSnap) {
            contactsListContainer.innerHTML = "";
            let groupAvatar = "https://api.dicebear.com/7.x/identicon/svg?seed=NexusCommunity";
            
            contactsListContainer.innerHTML += `
                <div class="list-card-item" style="background: rgba(99,102,241,0.15);" onclick="openGroupChatRoom()">
                    <img src="${groupAvatar}" class="item-avatar" alt="Group DP">
                    <div class="item-info">
                        <div class="item-title-wrapper">
                            <h4 class="item-title" style="color: #818cf8;">Nexus Community Group</h4>
                            <span class="item-meta-tag" style="background: #4f46e5; color: white;">Public</span>
                        </div>
                        <p class="item-sub" style="font-weight: bold; color: #cbd5e1;">Public Group Chat (Tap to join)</p>
                    </div>
                </div>`;

            let activeInboxUsers = new Set();
            chatsSnap.forEach(docSnap => {
                let m = docSnap.data();
                let isDeleted = m.deletedFor && m.deletedFor.includes(currentUsername);
                if (!isDeleted && (m.sender === currentUsername || m.receiver === currentUsername)) {
                    if (m.sender === currentUsername) activeInboxUsers.add(m.receiver);
                    if (m.receiver === currentUsername) activeInboxUsers.add(m.sender);
                }
            });

            usersSnap.forEach(d => {
                let uData = d.data();
                let u = uData.username;
                let avatar = uData.avatarUrl || "https://api.dicebear.com/7.x/bottts/svg?seed=Felix";
                let gender = uData.gender || "", country = uData.country || "";
                
                if (u && u !== currentUsername) {
                    if (searchQuery && !u.toLowerCase().includes(searchQuery.toLowerCase())) return;
                    if (selectedGenderFilter !== 'All' && gender !== selectedGenderFilter) return;
                    if (activeInboxUsers.has(u)) return;

                    contactsListContainer.innerHTML += `
                        <div class="list-card-item" onclick="openChatRoom('${u}', '${avatar}')">
                            <img src="${avatar}" class="item-avatar" alt="DP">
                            <div class="item-info">
                                <div class="item-title-wrapper">
                                    <h4 class="item-title">${u}</h4>
                                    <span class="item-meta-tag">${gender}</span>
                                    <span class="item-meta-tag">${country}</span>
                                </div>
                                <p class="item-sub">${formatLastSeen(uData.lastSeen)}</p>
                            </div>
                        </div>`;
                }
            });
        }

        function renderInboxList(usersSnap, chatsSnap) {
            inboxListContainer.innerHTML = "";
            let chatPartners = new Map(), userInfoMap = {};

            usersSnap.forEach(d => { userInfoMap[d.data().username] = { avatar: d.data().avatarUrl, gender: d.data().gender, country: d.data().country, lastSeen: d.data().lastSeen }; });

            chatsSnap.forEach(docSnap => {
                let m = docSnap.data();
                let isDeleted = m.deletedFor && m.deletedFor.includes(currentUsername);
                if (!isDeleted && (m.sender === currentUsername || m.receiver === currentUsername)) {
                    let partner = m.sender === currentUsername ? m.receiver : m.sender;
                    let msgTime = m.createdAt ? m.createdAt.toDate() : new Date(0);
                    if (!chatPartners.has(partner) || chatPartners.get(partner).time < msgTime) {
                        chatPartners.set(partner, { partner, time: msgTime });
                    }
                }
            });

            let partnersArr = Array.from(chatPartners.values()).sort((a, b) => b.time - a.time);
            partnersArr.forEach(item => {
                let partner = item.partner, pInfo = userInfoMap[partner] || {};
                let itemElem = document.createElement('div');
                itemElem.className = 'list-card-item';
                itemElem.innerHTML = `
                    <div style="display:flex; align-items:center; flex:1; overflow:hidden;">
                        <img src="${pInfo.avatar || ''}" class="item-avatar" alt="DP">
                        <div class="item-info">
                            <div class="item-title-wrapper"><h4 class="item-title">${partner}</h4></div>
                            <p class="item-sub">${formatLastSeen(pInfo.lastSeen)}</p>
                        </div>
                    </div>
                    <button class="delete-chat-btn">Delete</button>`;

                itemElem.querySelector(':scope > div:first-child').addEventListener('click', () => openChatRoom(partner, pInfo.avatar));
                itemElem.querySelector('.delete-chat-btn').addEventListener('click', (e) => { e.stopPropagation(); deleteChatWithUser(partner); });
                inboxListContainer.appendChild(itemElem);
            });
        }

        searchInput.addEventListener('input', (e) => { searchQuery = e.target.value.trim(); renderCurrentView(); });
        document.getElementById('navContactsBtn').addEventListener('click', () => { currentTab = 'contacts'; contactsSection.classList.remove('hidden'); inboxSection.classList.add('hidden'); chatRoomView.classList.add('hidden'); renderCurrentView(); });
        document.getElementById('navInboxBtn').addEventListener('click', () => { currentTab = 'inbox'; inboxSection.classList.remove('hidden'); contactsSection.classList.add('hidden'); chatRoomView.classList.add('hidden'); renderCurrentView(); });

        window.openChatRoom = async function(receiver, avatarUrl) {
            isGroupChatActive = false; activeChatReceiver = receiver;
            document.getElementById('chatRoomTitle').textContent = receiver;
            document.getElementById('chatHeaderAvatar').src = avatarUrl;
            chatRoomView.classList.remove('hidden');
            
            if(unsubscribeChat) unsubscribeChat();
            unsubscribeChat = onSnapshot(query(collection(db, "chats"), orderBy("createdAt", "asc")), (snapshot) => {
                let box = document.getElementById('chatMessagesBox');
                box.innerHTML = "";
                snapshot.forEach(d => {
                    let m = d.data();
                    let isDeleted = m.deletedFor && m.deletedFor.includes(currentUsername);
                    if (!isDeleted && ((m.sender === currentUsername && m.receiver === receiver) || (m.sender === receiver && m.receiver === currentUsername))) {
                        let isMyMsg = m.sender === currentUsername;
                        let contentHTML = "";
                        if (m.mediaType === 'video') {
                            contentHTML = `<video src="${m.mediaUrl}" class="chat-media-video" onclick="openFullscreenMedia('${m.mediaUrl}', 'video')"></video>`;
                        } else if (m.mediaUrl) {
                            contentHTML = `<img src="${m.mediaUrl}" class="chat-media-img" alt="Media" onclick="openFullscreenMedia('${m.mediaUrl}', 'image')">`;
                        } else {
                            contentHTML = `<span>${m.text}</span>`;
                        }
                        box.innerHTML += `<div class="chat-msg ${isMyMsg ? 'sent' : 'received'}">${contentHTML}${isMyMsg ? `<button class="chat-msg-delete-btn" onclick="deleteSingleChatMessage('${d.id}', false)">Delete</button>` : ''}</div>`;
                    }
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        window.openGroupChatRoom = function() {
            isGroupChatActive = true; activeChatReceiver = null;
            document.getElementById('chatRoomTitle').textContent = "Nexus Community Group";
            document.getElementById('chatHeaderAvatar').src = "https://api.dicebear.com/7.x/identicon/svg?seed=NexusCommunity";
            chatRoomView.classList.remove('hidden');

            if(unsubscribeChat) unsubscribeChat();
            unsubscribeChat = onSnapshot(query(collection(db, "groupChats"), orderBy("createdAt", "asc")), (snapshot) => {
                let box = document.getElementById('chatMessagesBox');
                box.innerHTML = "";
                snapshot.forEach(d => {
                    let m = d.data();
                    let isMyMsg = m.sender === currentUsername;
                    let contentHTML = "";
                    if (m.mediaType === 'video') {
                        contentHTML = `<video src="${m.mediaUrl}" class="chat-media-video" onclick="openFullscreenMedia('${m.mediaUrl}', 'video')"></video>`;
                    } else if (m.mediaUrl) {
                        contentHTML = `<img src="${m.mediaUrl}" class="chat-media-img" alt="Media" onclick="openFullscreenMedia('${m.mediaUrl}', 'image')">`;
                    } else {
                        contentHTML = `<span>${m.text}</span>`;
                    }
                    box.innerHTML += `<div class="chat-msg ${isMyMsg ? 'sent' : 'received'}"><span style="font-size: 11px; font-weight: bold; color: #818cf8;">${m.sender}</span>${contentHTML}${isMyMsg ? `<button class="chat-msg-delete-btn" onclick="deleteSingleChatMessage('${d.id}', true)">Delete</button>` : ''}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        document.getElementById('backToListBtn').addEventListener('click', () => { chatRoomView.classList.add('hidden'); renderCurrentView(); });
        
        document.getElementById('sendChatBtn').addEventListener('click', async () => {
            let text = document.getElementById('chatMessageInput').value.trim();
            if (!text) return;
            document.getElementById('chatMessageInput').value = "";
            if (isGroupChatActive) await addDoc(collection(db, "groupChats"), { sender: currentUsername, text, mediaUrl: "", mediaType: "", createdAt: serverTimestamp() });
            else if (activeChatReceiver) await addDoc(collection(db, "chats"), { sender: currentUsername, receiver: activeChatReceiver, text, mediaUrl: "", mediaType: "", isRead: false, deletedFor: [], createdAt: serverTimestamp() });
        });

        document.getElementById('chatMediaInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const isVideo = file.type.startsWith('video') || file.name.match(/\.(mp4|mkv|mov|webm|avi)$/i);
            const mediaType = isVideo ? 'video' : 'image';

            const reader = new FileReader();
            reader.onload = async function(uploadEvent) {
                const base64Data = uploadEvent.target.result;
                
                if (isGroupChatActive) {
                    await addDoc(collection(db, "groupChats"), { sender: currentUsername, text: "", mediaUrl: base64Data, mediaType, createdAt: serverTimestamp() });
                } else if (activeChatReceiver) {
                    await addDoc(collection(db, "chats"), { sender: currentUsername, receiver: activeChatReceiver, text: "", mediaUrl: base64Data, mediaType, isRead: false, deletedFor: [], createdAt: serverTimestamp() });
                }
                e.target.value = "";
            };
            reader.readAsDataURL(file);
        });

        window.deleteSingleChatMessage = async function(msgId, isGroup) {
            if (confirm("Delete this message?")) await deleteDoc(doc(db, isGroup ? "groupChats" : "chats", msgId));
        }

        window.deleteChatWithUser = async function(partner) {
            if (confirm(`Remove chat with "${partner}"?`)) {
                const chatsSnap = await getDocs(collection(db, "chats"));
                let updates = [];
                chatsSnap.forEach(d => {
                    let m = d.data();
                    if ((m.sender === currentUsername && m.receiver === partner) || (m.sender === partner && m.receiver === currentUsername)) {
                        let deletedFor = m.deletedFor || [];
                        if (!deletedFor.includes(currentUsername)) {
                            deletedFor.push(currentUsername);
                            updates.push(updateDoc(doc(db, "chats", d.id), { deletedFor }));
                        }
                    }
                });
                await Promise.all(updates);
                renderCurrentView();
            }
        }
    </script>
</body>
</html>
